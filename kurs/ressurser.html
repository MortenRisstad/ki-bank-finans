  const STORE = "kurs-noekkel";
  const fromB64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const toB64 = b => btoa(String.fromCharCode(...new Uint8Array(b)));

  async function deriveBits(password) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveBits"]);
    return crypto.subtle.deriveBits(
      { name: "PBKDF2", salt: fromB64(payload.salt), iterations: payload.iterations, hash: "SHA-256" }, base, 256);
  }

  async function decrypt(rawKey) {
    const key = await crypto.subtle.importKey("raw", rawKey, "AES-GCM", false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: fromB64(payload.iv) }, key, fromB64(payload.data));
    return new TextDecoder().decode(plain);
  }

  function show(htmlText) {
    document.open();
    document.write(htmlText);
    document.close();
  }

  async function tryStoredKey() {
    const stored = sessionStorage.getItem(STORE) || localStorage.getItem(STORE);
    if (!stored) return;
    try {
      show(await decrypt(fromB64(stored)));
    } catch (e) {
      // Gammel nøkkel (f.eks. etter passordbytte) – be om nytt passord
      sessionStorage.removeItem(STORE);
      localStorage.removeItem(STORE);
    }
  }

  document.getElementById("login").addEventListener("submit", async function (event) {
    event.preventDefault();
    const button = document.getElementById("submit");
    const error = document.getElementById("error");
    button.disabled = true;
    error.textContent = "";
    try {
      const rawKey = await deriveBits(document.getElementById("pw").value);
      const htmlText = await decrypt(rawKey);
      const storage = document.getElementById("remember").checked ? localStorage : sessionStorage;
      storage.setItem(STORE, toB64(rawKey));
      show(htmlText);
    } catch (e) {
      error.textContent = window.crypto && crypto.subtle
        ? "Feil passord. Prøv igjen."
        : "Nettleseren din støtter ikke dekryptering. Prøv en annen nettleser.";
      button.disabled = false;
    }
  });

  tryStoredKey();
})();
